[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "cvflow"
version = "0.1.0"
description = "Self-hosted Telegram bot that finds well-matched jobs daily and tailors your LaTeX resume per posting."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "python-telegram-bot~=22.0",
    "APScheduler>=3.11.3,<4",
    "python-jobspy~=1.4",
    "pycryptodome",
    "requests",
    "PyYAML",
    "pydantic~=2.14",
    "pypdf~=7.0",
    "python-docx~=1.2",
]

[project.scripts]
cvflow = "cvflow.cli:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
    "types-PyYAML",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["jobspy", "apscheduler.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]  # make the repo root importable so cross-test helpers (tests.*) resolve under a bare `pytest`
